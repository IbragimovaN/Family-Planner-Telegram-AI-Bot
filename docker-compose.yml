services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_PATH: /app/server/data/family-planner-v2.db
      DATABASE_BACKUP_DIR: /app/server/data/backups
    ports:
      - "3000:3000"
    volumes:
      - server-data:/app/server/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  server-data:
